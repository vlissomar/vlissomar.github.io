<!DOCTYPE html>

<!-- credit goes to Allena Olgvie for the prettiness of this page, who originally used this style on a different group project I worked with her on-->

<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sophia Liu - CS180 Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,600&display=swap" rel="stylesheet"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/MathJax.js?config=default"></script>
    <style>
        :root {
            --white:       #ffffff;
            --off-white:   #f8fafc;
            --ice:         #daeaf5;
            --pale-blue:   #b8d9ef;
            --mid-blue:    #7ab3d4;
            --deep-blue:   #3a7fa8;
            --text:        #1e2b35;
            --text-mid:    #4a6070;
            --text-dim:    #8ba5b5;
            --border:      #d0e5f0;
            --mono:        'DM Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--white);
            color: var(--text);
            font-family: 'Source Serif 4', Georgia, serif;
            font-size: 16px;
            line-height: 1.8;
            overflow-x: hidden;
        }

        /* ── SNOW HALFTONE SIDES ── */
        body::before, body::after {
            content: '';
            position: fixed;
            top: 0;
            width: 180px;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            left: 0;
            background:
                    radial-gradient(ellipse 160px 120px at 40px calc(100vh - 10px), rgba(184,217,239,0.55) 0%, transparent 100%),
                    radial-gradient(ellipse 100px 60px at 20px calc(100vh - 5px), rgba(218,234,245,0.7) 0%, transparent 100%),
                    linear-gradient(to right, rgba(218,234,245,0.28) 0%, rgba(218,234,245,0.06) 60%, transparent 100%);
            background-repeat: no-repeat, no-repeat, no-repeat;
        }

        body::after {
            right: 0;
            background:
                    radial-gradient(ellipse 160px 120px at 140px calc(100vh - 10px), rgba(184,217,239,0.55) 0%, transparent 100%),
                    radial-gradient(ellipse 100px 60px at 160px calc(100vh - 5px), rgba(218,234,245,0.7) 0%, transparent 100%),
                    linear-gradient(to left, rgba(218,234,245,0.28) 0%, rgba(218,234,245,0.06) 60%, transparent 100%);
            background-repeat: no-repeat, no-repeat, no-repeat;
        }

        /* ── LAYOUT ── */
        .page {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }
		/* ── STUFF I ADDED ── */
		.container {
		    display: flex;
		    align-items: center; /* Vertically centers the text and image */
		    gap: 20px;           /* Adds space between the text and the image */
		    margin: 1.5rem 0;    /* Matches the vertical spacing of your other image areas */
		}
		
		/* Force both the text block and image wrapper to share equal width */
		.container > * {
		    flex: 1;
		    min-width: 0;        /* Prevents layout blowouts from long strings or large files */
		}
		
		/* Force the image to fluidly fill its half of the container */
		.container img {
		    width: 100%;
		    height: auto;
		    display: block;
		    border-radius: 6px;  /* Matches your stylesheet's figure img styling */
		    border: 1px solid var(--border); /* Matches your stylesheet's figure img styling */
		}



        /* ── HEADER ── */
        header {
            padding: 5rem 0 3rem;
            border-bottom: 1.5px solid var(--border);
            margin-bottom: 3rem;
        }

        .header-label {
            font-family: var(--mono);
            font-size: 0.7rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--mid-blue);
            margin-bottom: 1.2rem;
        }

        h1.title {
            font-family: 'Lora', Georgia, serif;
            font-size: clamp(2.2rem, 5vw, 3.4rem);
            font-weight: 600;
            line-height: 1.15;
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        h1.title em {
            font-style: italic;
            color: var(--deep-blue);
        }

        .subtitle {
            font-family: 'Lora', serif;
            font-style: italic;
            font-size: 1.05rem;
            color: var(--text-mid);
            margin-bottom: 2rem;
        }

        .meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            font-family: var(--mono);
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .meta-row a {
            color: var(--deep-blue);
            text-decoration: none;
            border-bottom: 1px solid var(--pale-blue);
            transition: color 0.2s, border-color 0.2s;
        }

        .meta-row a:hover {
            color: var(--mid-blue);
            border-color: var(--mid-blue);
        }

        /* ── VIDEO EMBED ── */
        .video-block {
            margin: 2.5rem 0;
            border: 1.5px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            background: var(--off-white);
        }

        .video-block iframe,
        .video-block video {
            width: 100%;
            display: block;
            aspect-ratio: 16/9;
        }

        .video-caption {
            padding: 0.75rem 1rem;
            font-family: var(--mono);
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 0.05em;
            border-top: 1px solid var(--border);
        }

        /* ── SECTION STRUCTURE ── */
        section {
            padding: 3rem 0;
            border-bottom: 1px solid var(--border);
        }

        section:last-child {
            border-bottom: none;
        }

        .section-tag {
            font-family: var(--mono);
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--mid-blue);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .section-tag::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        h2 {
            font-family: 'Lora', serif;
            font-size: 1.7rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 1.2rem;
            line-height: 1.3;
        }

        h3 {
            font-family: 'Lora', serif;
            font-size: 1.15rem;
            font-weight: 600;
            font-style: italic;
            color: var(--deep-blue);
            margin: 2rem 0 0.6rem;
        }

        p {
            margin-bottom: 1.1rem;
            color: var(--text);
        }

        /* ── IMAGE AREAS ── */
        .img-slot {
            background: var(--off-white);
            border: 1.5px dashed var(--pale-blue);
            border-radius: 6px;
            padding: 2rem;
            text-align: center;
            margin: 1.5rem 0;
            color: var(--text-dim);
            font-family: var(--mono);
            font-size: 0.75rem;
            letter-spacing: 0.08em;
        }

        .img-slot img {
            max-width: 100%;
            border-radius: 4px;
            display: block;
            margin: 0 auto 0.75rem;
        }

        .img-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
            margin: 1.5rem 0;
        }

        .img-grid .img-slot {
            margin: 0;
        }
		
		.img-grid-3 {
		    display: grid;
		    grid-template-columns: repeat(3, 1fr);
		    gap: 1.2rem;
		    margin: 1.5rem 0;
		}
		
		.img-grid-3 .img-slot {
		    margin: 0; /* Keeps the border structural styling while removing extra outer margins */
		}
		
		.img-grid-4 {
		    display: grid;
		    grid-template-columns: repeat(4, 1fr);
		    gap: 1.2rem;
		    margin: 1.5rem 0;
		}
		
		.img-grid-4 .img-slot {
		    margin: 0; 
		}

        figure {
            margin: 1.5rem 0;
        }

        figure img {
            width: 100%;
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        figcaption {
            font-family: var(--mono);
            font-size: 0.7rem;
            color: var(--text-dim);
            text-align: center;
            margin-top: 0.5rem;
            letter-spacing: 0.05em;
        }

        /* ── CONTRIBUTOR CARDS ── */
        .contrib-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .contrib-card {
            background: var(--off-white);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1.25rem 1.4rem;
            border-top: 3px solid var(--pale-blue);
        }

        .contrib-name {
            font-family: 'Lora', serif;
            font-weight: 600;
            font-size: 1rem;
            color: var(--text);
            margin-bottom: 0.2rem;
        }

        .contrib-email {
            font-family: var(--mono);
            font-size: 0.65rem;
            color: var(--text-dim);
            margin-bottom: 0.75rem;
        }

        .contrib-body {
            font-size: 0.9rem;
            color: var(--text-mid);
            line-height: 1.6;
        }

        /* ── REFERENCES ── */
        ol.refs {
            counter-reset: ref;
            list-style: none;
            padding: 0;
        }

        ol.refs li {
            counter-increment: ref;
            position: relative;
            padding-left: 2rem;
            margin-bottom: 0.75rem;
            font-size: 0.9rem;
            color: var(--text-mid);
        }

        ol.refs li::before {
            content: '[' counter(ref) ']';
            position: absolute;
            left: 0;
            font-family: var(--mono);
            font-size: 0.7rem;
            color: var(--mid-blue);
            top: 0.15rem;
        }

        ol.refs a {
            color: var(--deep-blue);
            text-decoration: none;
            border-bottom: 1px solid var(--pale-blue);
        }

        /* ── INLINE CODE ── */
        code {
            font-family: var(--mono);
            font-size: 0.82em;
            background: var(--ice);
            color: var(--deep-blue);
            padding: 0.1em 0.4em;
            border-radius: 3px;
        }

        /* ── CALLOUT ── */
        .callout {
            background: var(--off-white);
            border-left: 3px solid var(--mid-blue);
            padding: 1rem 1.4rem;
            margin: 1.5rem 0;
            border-radius: 0 6px 6px 0;
        }

        .callout p {
            margin: 0;
            font-size: 0.95rem;
            color: var(--text-mid);
        }

        /* ── FOOTER ── */
        footer {
            padding: 3rem 0;
            text-align: center;
            font-family: var(--mono);
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 0.1em;
            border-top: 1px solid var(--border);
            margin-top: 2rem;
        }

        /* ── SNOWFLAKE DIVIDER ── */
        .snow-divider {
            text-align: center;
            color: var(--pale-blue);
            font-size: 1rem;
            letter-spacing: 1rem;
            margin: 0.5rem 0;
            user-select: none;
        }

      /* ── HYBRID SPLIT: FULL SIZE & SHRUNK CENTERED ── */
        .image-hybrid-split {
          display: grid;
          grid-template-columns: 1fr 1fr; /* Splits the layout into two equal 50% columns */
          gap: 24px;
          margin: 2rem 0;
          align-items: center; /* Vertically centers the right side if heights differ */
        }
        
        /* The left slot: image scales fluidly to fill its half of the screen */
        .image-hybrid-split .slot-fluid img {
          width: 100%;
          height: auto;
          display: block;
          border-radius: 6px;
          border: 1px solid var(--border);
        }
        
        /* The right slot: acts as a centering canvas for the small image */
        .image-hybrid-split .slot-nested-small {
          display: flex;
          justify-content: center; /* Horizontally centers the small container */
          align-items: center;     /* Vertically centers the small container */
          width: 100%;
        }
        
        /* The actual smaller image container and its properties */
        .image-hybrid-split .small-wrapper {
          width: 35%; /* Controls how small the image gets relative to its half-page canvas */
          min-width: 120px; /* Prevents it from becoming microscopic on smaller screens */
        }
        
        .image-hybrid-split .small-wrapper img {
          width: 100%;
          height: auto;
          display: block;
          border-radius: 6px;
          border: 1px solid var(--border);
        }
        
        /* Micro-captions under each side to match your example */
        .hybrid-caption {
          font-family: var(--mono);
          font-size: 0.75rem;
          color: var(--text-mid);
          text-align: center;
          margin-top: 0.75rem;
        }
        
        /* Responsive collapse for small screens */
        @media (max-width: 640px) {
          .image-hybrid-split {
            grid-template-columns: 1fr; /* Stacks them vertically on mobile */
            gap: 2rem;
          }
          .image-hybrid-split .small-wrapper {
            width: 50%; /* Allows the small image to grow slightly larger for readability on phones */
          }
          body::before, body::after { width: 60px; }
          .img-grid { grid-template-columns: 1fr; }
          .img-grid-3 { grid-template-columns: 1fr; }
          .img-grid-4 { grid-template-columns: 1fr; }
          .contrib-grid { grid-template-columns: 1fr; }
          .meta-row { gap: 1rem; }
        }
    </style>
</head>
<body>
    <div class="page">
        <header>
            <p class="header-label"><a href="https://vlissomar.github.io/">Index</a></p>
            <h1 class="title">CS180 2026 Fall Portfolio</h1>
            <p class="subtitle">Sophia Liu</p>
        </header>
        
		<div class="img-grid-3">
			<div class="img-slot">
				<img src="temp.png"/>
                <a href="./proj0/index.html">Project 0</a>
            </div>
            <div class="img-slot">
				<img src="temp.png"/>
                <a href="./proj1/index.html">Project 1</a>
			</div>
            <div class="img-slot">
                <a href="./proj2/index.html">Project 2</a>
				<img src="temp.png"/>
			</div>
		</div>
        <div class="img-slot">
            <a href="./proj3/index.html">Project 3</a>
			<img src="temp.png"/>
        </div>
    </div>
</body>
</html>
